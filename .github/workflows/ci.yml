name: CI

# Validate pull requests and main. Hosting is configured separately.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow only inspects the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    # This build is seconds. Ten minutes means something has hung, and it should
    # say so here rather than sit until the runner's own timeout hours later.
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads mise.toml, which is where bun's version is already pinned for
      # everyone working on this repo. This used to be oven-sh/setup-bun with
      # `bun-version: "1.3"` written out here -- a second place to change one
      # version, and two places drift.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

        with:
          version: '2026.9.12'
          sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
          install: false
      - name: Prepare the declared task dependencies
        run: mise run setup

      - name: Validate workflow controls
        run: actionlint

      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test
